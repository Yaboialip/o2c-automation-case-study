<rect x="972" y="475.0" width="116" height="60" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
<text x="1030" y="491.0" text-anchor="middle" font-size="10.5" fill="#1f2937">Create invoice</text>
<text x="1030" y="504.0" text-anchor="middle" font-size="10.5" fill="#1f2937">manually in Excel</text>
<text x="1030" y="517.0" text-anchor="middle" font-size="10.5" fill="#1f2937">template</text>
