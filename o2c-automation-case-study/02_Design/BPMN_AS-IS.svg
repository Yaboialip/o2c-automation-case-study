<rect width="1520" height="600" fill="#fff"/><text x="12" y="28" font-size="18" font-weight="bold" fill="#1f2937">AS-IS: Manual Order-to-Cash (PT Maju Distribusi Nusantara). Red = manual, error-prone task</text>
